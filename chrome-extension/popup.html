<!DOCTYPE html>
<html>
<head>
  <title>Observability AI</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; width: 300px; padding: 16px; background-color: #1e1e1e; color: #fff; }
    h2 { margin-top: 0; font-size: 16px; color: #61dafb; }
    label { display: block; margin-top: 10px; font-size: 12px; font-weight: bold; color: #aaa; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; background: #333; border: 1px solid #444; color: #fff; border-radius: 4px; }
    button { margin-top: 16px; width: 100%; padding: 10px; background-color: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #005999; }
    #status { margin-top: 10px; font-size: 12px; color: #4caf50; display: none; }
  </style>
</head>
<body>
  <h2>✨ Observability AI Setup</h2>
  <p style="font-size: 12px; color: #ccc;">Configure connection to your local AI backend.</p>
  
  <label for="apiUrl">Backend URL</label>
  <input type="text" id="apiUrl" value="http://localhost:8080" placeholder="http://localhost:8080" />

  <label for="apiKey">API Key</label>
  <input type="password" id="apiKey" placeholder="dev-key-change-me-in-production" />

  <button id="saveBtn">Save Settings</button>
  <div id="status">Settings saved successfully!</div>

  <script src="popup.js"></script>
</body>
</html>
